name: build

on:
  push:
    branches: [main]
    paths:
      - "acct-group/**"
      - "acct-user/**"
      - "cosmic-base/**"
      - "eclass/**"
      - "x11-themes/**"
      - "scripts/ci-*.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space separated atoms (e.g. cosmic-base/cosmic-comp). Empty: all."
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      atoms: ${{ steps.list.outputs.atoms }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          if [ -n "$INPUT_PACKAGES" ]; then
            atoms=$(printf '%s\n' $INPUT_PACKAGES | jq -R . | jq -sc .)
          elif [ -f EPOCH ]; then
            atoms=$( { jq -r '.packages[].pn | "cosmic-base/" + .' packages.json
                       echo x11-themes/pop-icon-theme; echo x11-themes/adw-gtk3; } | jq -R . | jq -sc .)
          else
            atoms='["x11-themes/pop-icon-theme","x11-themes/adw-gtk3"]'
          fi
          echo "atoms=$atoms" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        atom: ${{ fromJSON(needs.plan.outputs.atoms) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Build in Gentoo container
        run: scripts/ci-build.sh "${{ matrix.atom }}"
      - name: Sanitize file names
        if: always()
        run: sudo find out -name '*:*' -exec bash -c 'mv "$0" "${0//:/_}"' {} \; 2>/dev/null || true
      - name: Name artifact
        if: always()
        id: name
        run: echo "name=$(echo '${{ matrix.atom }}' | tr / _)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
