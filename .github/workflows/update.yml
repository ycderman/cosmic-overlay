name: update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      epoch:
        description: "COSMIC epoch to package (e.g. 1.12.0). Empty: latest upstream tag."
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Find epoch
        id: epoch
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_EPOCH: ${{ inputs.epoch }}
        run: |
          want="$INPUT_EPOCH"
          if [ -z "$want" ]; then
            want=$(gh api repos/pop-os/cosmic-epoch/tags --paginate -q '.[].name' \
              | sed -n 's/^epoch-//p' | sort -V | tail -1)
          fi
          have=$(cat EPOCH 2>/dev/null || true)
          echo "upstream=$want overlay=$have"
          echo "pv=$want" >> "$GITHUB_OUTPUT"
          if [ "$want" = "$have" ] && [ -z "$INPUT_EPOCH" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.epoch.outputs.skip != '1'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Vendor sources
        if: steps.epoch.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PV: ${{ steps.epoch.outputs.pv }}
        run: |
          rustup toolchain install stable --profile minimal
          mkdir -p dist
          gh release download "epoch-$PV" -D dist -p '*.full.tar.zst' 2>/dev/null || true
          jq -r '.packages[] | "\(.pn) \(.repo) \(.owner // "pop-os") \(.tag // "") \(.pv // "")"' packages.json \
          | while read -r pn repo owner tag own; do
            if [ -n "$own" ]; then
              rel="$pn-$own"; ppv="$own"
              gh release download "$rel" -D dist -p '*.full.tar.zst' 2>/dev/null || true
            else
              rel="epoch-$PV"; ppv="$PV"; tag="epoch-$PV"
            fi
            if [ -f "dist/$pn-$ppv.full.tar.zst" ]; then echo "reuse $pn"; continue; fi
            echo "::group::$pn"
            scripts/vendor.sh "$pn" "$repo" "$tag" "$ppv" dist "$owner"
            echo "$rel" > "dist/$pn-$ppv.release"
            echo "::endgroup::"
          done

      - name: Publish release assets
        if: steps.epoch.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PV: ${{ steps.epoch.outputs.pv }}
        run: |
          shopt -s nullglob
          for f in dist/*.release; do
            rel=$(cat "$f"); asset="${f%.release}.full.tar.zst"
            if gh release view "$rel" >/dev/null 2>&1; then
              gh release upload "$rel" "$asset" --clobber
            else
              gh release create "$rel" "$asset" --title "$rel" \
                --notes "Upstream source with vendored Cargo dependencies."
            fi
          done

      - name: Generate ebuilds and commit
        if: steps.epoch.outputs.skip != '1'
        env:
          PV: ${{ steps.epoch.outputs.pv }}
        run: |
          python3 scripts/gen.py "$PV" dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cosmic-base EPOCH
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "cosmic-base: update to epoch $PV"
            git pull --rebase
            git push
          fi

      - name: Start build
        if: steps.epoch.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
